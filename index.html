  <body>
    <div id="root">
      <div class="global-loader">
        <div class="spinner"></div>
      </div>
    </div>

    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('root').innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#fff;background:#1a1b26;text-align:center;padding:2rem;font-family:system-ui,sans-serif;">
            <h2 style="margin-bottom:1rem;color:#7aa2f7;">Cannot run directly from file://</h2>
            <p style="margin-bottom:1rem;max-width:400px;line-height:1.5;">Modern JavaScript apps use ES Modules which are blocked by browser security policies when opening files directly.</p>
            <p style="font-size:0.9rem;opacity:0.7;">Please serve this folder with a local web server.</p>
            <div style="margin-top:1.5rem;background:#24283b;padding:1rem;border-radius:8px;text-align:left;">
              <code style="display:block;margin-bottom:0.5rem;color:#9ece6a;">npm run serve</code>
              <code style="display:block;color:#9ece6a;">python3 -m http.server 3000</code>
            </div>
          </div>
        `;
      }
    </script>
    <script type="module" src="bundle.js"></script>
  </body>
